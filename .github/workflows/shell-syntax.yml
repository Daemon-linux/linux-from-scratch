name: Validate shell scripts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            printf 'Checking %s\\n' "$script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

  python-validation:
    name: Python syntax and anonymizer tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python syntax
        run: python -m py_compile scripts/collect-evidence/anonymize-audit-evidence.py

      - name: Test anonymizer
        run: python -m unittest discover -s scripts/collect-evidence -p 'test_*.py' -v
